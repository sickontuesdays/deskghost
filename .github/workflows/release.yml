name: Release

# Builds the installer, signs the update, and publishes a GitHub release.
#
# To ship a version:
#   1. bump "version" in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml (all three must match)
#   2. add the notes to CHANGELOG.md
#   3. git tag v0.3.0 && git push origin v0.3.0
#
# The release is created as a DRAFT so the notes can be edited. Installed copies only see the new version once
# the release is published — publishing it is what actually ships the update.
#
# Secrets this needs (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of %USERPROFILE%\.tauri\deskghost.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password that key was generated with

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The notes end up in latest.json, which is what the in-app update card shows — so they come from the
      # CHANGELOG's top section rather than a fixed sentence. Editing the draft release afterwards does NOT
      # change them: latest.json is written here, at build time.
      - name: Read the newest CHANGELOG section
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            awk '/^## /{ if (n++) exit; next } n { print }' CHANGELOG.md
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DeskGhost ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # writes latest.json next to the installer — this is the file installed copies read
          includeUpdaterJson: true
